<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PoRobotTrain — R1 Stand Explore</title>
    <base href="/" />
    <link rel="stylesheet" href="_content/Radzen.Blazor/css/material-base.css" />
    <link rel="stylesheet" href="css/app.css?v=2" />
    <!-- Browser twin libraries (exact versions; loaded lazily by wwwroot/js/twin/*). The 3D view falls back to the
         server PNG render if they cannot load, e.g. on an offline robot laptop. -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.webgpu.js",
            "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.webgpu.js",
            "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.tsl.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/",
            "three-nebula": "https://cdn.jsdelivr.net/npm/three-nebula@13.3.0/dist/three-nebula.mjs",
            "three-nebula/webgpu": "https://cdn.jsdelivr.net/npm/three-nebula@13.3.0/dist/three-nebula-webgpu.mjs",
            "@dimforge/rapier3d-compat": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.21.0/+esm",
            "tone": "https://cdn.jsdelivr.net/npm/tone@15.1.22/+esm",
            "onnxruntime-web": "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.31.1/dist/ort.bundle.min.mjs",
            "@huggingface/transformers": "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.2"
        }
    }
    </script>
    <script src="_content/Radzen.Blazor/Radzen.Blazor.js"></script>
</head>
<body>
    <div id="app">
        <div style="padding:32px;font-family:system-ui,sans-serif;color:#eef1f7">Loading PoRobotTrain Blazor WASM...</div>
    </div>

    <div id="blazor-error-ui" style="display:none">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
    </div>
    <script>
        window.poScrollIntoView = (id) => document.getElementById(id)?.scrollIntoView({ behavior: "smooth", block: "center" });
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
