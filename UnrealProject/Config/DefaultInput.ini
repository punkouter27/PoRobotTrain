; R1Twin input settings. NOT YET VERIFIED in a running UE 5.7 editor (see docs/ue5_setup.md).
; All bindings are Enhanced Input actions created in code (see Source/R1Twin/Public/R1FollowCamera.h);
; no legacy ActionMappings / AxisMappings and no .uasset are needed.

[/Script/Engine.InputSettings]
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent
; Cursor stays free; the viewport captures the mouse only while the right button is held (orbit).
bCaptureMouseOnLaunch=False
DefaultViewportMouseCaptureMode=CaptureDuringRightMouseDown
DefaultViewportMouseLockMode=LockOnCapture
bAlwaysShowTouchInterface=False
bShowConsoleOnFourFingerTap=False
bEnableMouseSmoothing=True
bEnableFOVScaling=True
FOVScale=0.011110
DoubleClickTime=0.200000
bUseMouseForTouch=False
bEnableGestureRecognizer=False
bRequireCtrlToNavigateAutoCollapse=False
ConsoleKeys=Tilde
