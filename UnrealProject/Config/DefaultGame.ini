; R1Twin game settings. NOT YET VERIFIED in a running UE 5.7 editor (see docs/ue5_setup.md).

[/Script/EngineSettings.GeneralProjectSettings]
ProjectID=6F1D2C3B4A5E4F60B7C8D9E0F1A2B3C4
ProjectName=R1 Twin
ProjectDisplayedTitle=NSLOCTEXT("[/Script/EngineSettings]", "R1TwinTitle", "Unitree R1 Digital Twin")
CompanyName=PoRobotTrain
Description=Unitree R1 humanoid digital twin: MuJoCo physics via UnrealRoboticsLab, ONNX policy via NNE.
ProjectVersion=0.1.0
bStartInVR=False

[/Script/UnrealEd.ProjectPackagingSettings]
Build=IfProjectHasCode
BuildConfiguration=PPBC_Development
bUseIoStore=True
bUsePakFile=True
+DirectoriesToAlwaysCook=(Path="/Game/Project/RL_Policies")
+DirectoriesToAlwaysCook=(Path="/Game/Project/DataAssets")

[/Script/R1Twin.R1TwinGameMode]
DefaultPolicyModelPath=/Game/Project/RL_Policies/r1_level0_upperbody.r1_level0_upperbody
; Behaviour workflow (head-only neck turn etc.): do not run the 7-joint Level 0 policy on Play; the twin holds
; its pose and is driven by the behaviour panel / Python service. Set True to get the old Level 0 sweep back.
bRunLevel0PolicyOnPlay=False

[/Script/R1Twin.R1BehaviourPanel]
ServiceUrl="http://127.0.0.1:8765"
Behaviour=neck_turn

; Config DataAssets (Po Game Standard C9/C10): reward weights + curriculum (mirrors RobotControl/configs/reward_config.json)
; and showcase (idle threshold, demo cameras, overlay). Edit them in the editor under /Game/Project/DataAssets.
[/Script/R1Twin.R1ShowcaseSettings]
ShowcaseConfig=/Game/Project/DataAssets/DA_R1ShowcaseConfig.DA_R1ShowcaseConfig
RewardConfig=/Game/Project/DataAssets/DA_R1RewardConfig.DA_R1RewardConfig
