[/Script/Engine.PhysicsSettings]
; MuJoCo (URLab, async thread, Options.Timestep = 0.005 s) is the ONLY physics authority.
; Chaos stays compiled in (URLab's scene components and the editor rely on the collision/query
; machinery) but is prevented from doing any work:
;   * DefaultGravityZ = 0      -> nothing that accidentally simulates will fall
;   * no substepping, no async physics tick
;   * every actor keeps SetSimulatePhysics(false); AR1TwinGameMode::DisableChaosOnAllActors()
;     enforces this on every primitive component when play starts, and URLab articulation
;     components never enable Chaos simulation themselves.
DefaultGravityZ=0.000000
bEnablePCM=True
bSubstepping=False
bSubsteppingAsync=False
bTickPhysicsAsync=False
bEnableEnhancedDeterminism=False
bDisableCCD=True
bDefaultHasComplexCollision=False
bSuppressFaceRemapTable=False
bSupportUVFromHitResults=False
bDisableActiveActors=False
bDisableKinematicStaticPairs=False
bDisableKinematicKinematicPairs=False
bSimulateSkeletalMeshOnDedicatedServer=False
DefaultShapeComplexity=CTF_UseSimpleAndComplex
MaxPhysicsDeltaTime=0.033333
MinPhysicsDeltaTime=0.000000
MaxSubstepDeltaTime=0.016667
MaxSubsteps=6
SyncSceneSmoothingFactor=0.000000
InitialAverageFrameRate=0.016667
PhysXTreeRebuildRate=10

[/Script/Engine.Engine]
; No fixed engine frame rate: the policy runs on its own 50 Hz accumulator (UR1PolicyComponent) and
; MuJoCo steps at 0.005 s on URLab's worker thread (SimSpeedPercent = 100 keeps it real-time).
bUseFixedFrameRate=False
bSmoothFrameRate=True
SmoothedFrameRateRange=(LowerBound=(Type=Inclusive,Value=22.000000),UpperBound=(Type=Exclusive,Value=120.000000))

[/Script/Engine.StreamingSettings]
s.AsyncLoadingThreadEnabled=True

