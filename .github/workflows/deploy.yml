name: Test & Deploy Showcase

# The one workflow. Push to master: Python checks (ruff, pytest) -> .NET format/build/tests -> build the showcase site
# (web/build.py) -> deploy it to the Azure Static Web App swa-porobottrain (resource group PoShared) -> check / and
# /diag live (X-Commit header = this commit). Pull requests get the checks and the build, never a deploy. The Unreal
# project is built locally (GitHub's runners have no Unreal Engine) after scripts/setup_urlab.ps1 recreates URLab.
#
# Repo secret: AZURE_STATIC_WEB_APPS_API_TOKEN (the Static Web App's deployment token).
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # pinned to commit SHAs: the deploy token goes to these actions, so a moved tag must not change what runs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # RobotControl (editable, pins mujoco==4.0.0) + the [dependency-groups] dev list in pyproject.toml
      - name: Install Python dependencies
        run: python -m pip install -e RobotControl "pytest>=8.0" "ruff==0.17.6"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Tests
        env:
          MUJOCO_GL: osmesa
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libosmesa6
          python -m pytest

      # The Blazor WASM control UI + API (PoRobotTrain.slnx): format, Release build (0 warnings), Unit + Integration.
      # It is not deployed (it runs on the operator's PC next to the robot); browser tests: scripts/run-e2eui.ps1.
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: .NET format, build, tests
        run: |
          dotnet format PoRobotTrain.slnx --verify-no-changes
          dotnet build PoRobotTrain.slnx -c Release -warnaserror
          dotnet test tests/PoRobotTrain.Unit -c Release --no-build
          dotnet test tests/PoRobotTrain.Integration -c Release --no-build

      - name: Build the showcase site
        id: build
        run: |
          python web/build.py
          echo "version=$(python -c 'import json; print(json.load(open("web/dist/version.json"))["version"])')" >> "$GITHUB_OUTPUT"

      - name: Deploy to Azure Static Web Apps
        id: deploy
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: web/dist
          skip_app_build: true
          skip_api_build: true

      - name: Check / and /diag live
        if: steps.deploy.outcome == 'success'
        env:
          URL: ${{ steps.deploy.outputs.static_web_app_url }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          for i in $(seq 1 20); do
            if curl -fsSI --max-time 30 "$URL/" | grep -qi "^x-commit: $GITHUB_SHA" \
              && curl -fsS --max-time 30 "$URL/version.json" | grep -q "\"$VERSION\"" \
              && curl -fsS --max-time 30 "$URL/" | grep -q "PoRobotTrain" \
              && curl -fsS --max-time 30 "$URL/diag" | grep -q "<title>System status</title>" \
              && curl -fsS --max-time 30 "$URL/diag_checks.json" | grep -q '"checks"'; then
              echo "Live: $URL ($VERSION, X-Commit $GITHUB_SHA), / and /diag served"; exit 0
            fi
            sleep 15
          done
          echo "$URL did not serve $VERSION with X-Commit $GITHUB_SHA on / and /diag"; exit 1
