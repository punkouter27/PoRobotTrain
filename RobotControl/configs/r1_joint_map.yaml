# Unitree R1 EDU (A5 arm variant, 26 motors) joint map.
# SINGLE SOURCE OF TRUTH for joint order, motor slots, limits, gains.
# Every tool (MJCF generator, training env, ONNX validator, sim & real interfaces) reads this file.
#
# policy_index : order used in observation/action vectors (Unitree SDK2 r1_low_level_example order)
# motor_slot   : index into unitree_hg LowCmd_.motor_cmd[] / LowState_.motor_state[] (31 slots; 14,20,21,27,28 unused on A5)
# limits       : rad, from unitree_mujoco R1_C++.xml (legs/waist/arms) and unitree_ros R1.urdf (head)
# kp/kd        : mjlab unitree_r1 r1_constants.py (body), Unitree r1_A5_low_level_example.py (head)
# effort       : Nm, actuatorfrcrange from MJCF (body), URDF <limit effort> (head)
# action_scale : rad per unit action for Level 2+ velocity policies = 0.25 * effort / kp (mjlab convention); head values chosen for usable range
# default      : rad, mjlab HOME keyframe (robot standing)
robot: unitree_r1_a5
num_joints: 26
lowcmd_num_slots: 31
lowcmd_topic: rt/lowcmd
lowstate_topic: rt/lowstate
msg_type: unitree_hg
imu_body: pelvis
groups:
  left_leg:  [0, 1, 2, 3, 4, 5]
  right_leg: [6, 7, 8, 9, 10, 11]
  waist:     [12, 13]
  left_arm:  [14, 15, 16, 17, 18]
  right_arm: [19, 20, 21, 22, 23]
  head:      [24, 25]
joints:
  - {policy_index: 0,  name: left_hip_pitch_joint,       motor_slot: 0,  axis: [0,1,0], limits: [-2.93215, 2.54818],  kp: 100, kd: 2,   effort: 60,   action_scale: 0.15,   default: -0.10}
  - {policy_index: 1,  name: left_hip_roll_joint,        motor_slot: 1,  axis: [1,0,0], limits: [-1.0472,  1.74533],  kp: 100, kd: 2,   effort: 60,   action_scale: 0.15,   default: 0.0}
  - {policy_index: 2,  name: left_hip_yaw_joint,         motor_slot: 2,  axis: [0,0,1], limits: [-2.7402,  2.7402],   kp: 100, kd: 2,   effort: 60,   action_scale: 0.15,   default: 0.0}
  - {policy_index: 3,  name: left_knee_joint,            motor_slot: 3,  axis: [0,1,0], limits: [-0.174533, 2.42601], kp: 100, kd: 2,   effort: 60,   action_scale: 0.15,   default: 0.30}
